<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>화투 · 맞고 / 3인 고스톱</title><link rel="stylesheet" href="css/style.css"></head>
<body><main id="app" class="app"><header class="toolbar"><strong>花鬪 · 화투</strong><button id="modeBtn">2인 맞고</button><label>패 <select id="styleSelect"><option value="item-default">전통</option><option value="item-2">전통 위트</option><option value="item-3">네온</option></select></label><label>뒷면 <select id="backSelect"><option value="1">1 빨강</option><option value="2">2 검정</option><option value="3">3 남금</option><option value="4">4 비단</option><option value="5">5 빈티지</option><option value="6">6 홀로</option></select></label><label>판 <select id="boardSelect"><option value="green">녹색</option><option value="navy">남색</option></select></label><label>속도 <select id="speedSelect"><option value="slow">느림</option><option value="normal">보통</option><option value="quick">빠름</option><option value="off">끔</option></select></label><button id="configBtn">Esc 설정</button><a class="onlineLink" href="online.html" title="온라인 가족 대전">온라인 대전</a><span class="wallet" id="wallet"></span></header>
<div id="board" class="board">
 <section class="enemy enemyA"><div class="strip"><strong id="name1">컴퓨터</strong><span id="score1"></span></div><div class="enemyHand" id="hand1"></div><div class="capture" id="cap1"></div></section>
 <section class="enemy enemyB" id="enemyB"><div class="strip"><strong>컴퓨터 B</strong><span id="score2"></span></div><div class="enemyHand" id="hand2"></div><div class="capture" id="cap2"></div></section>
 <section class="middle"><div class="fieldHead"><strong>바닥패 <span id="fieldCount"></span></strong><span id="activeLabel"></span></div><div class="field" id="field"></div><div class="drawStack"><button id="deck" class="card back" title="뒤집기"></button><small id="deckCount"></small></div></section>
 <section class="self"><div class="strip"><strong>내가 먹은 패</strong><button type="button" id="captureToggle" class="captureToggle" aria-expanded="true">접기</button><span id="score0"></span></div><div class="capture" id="cap0"></div><div class="strip handHead"><strong>내 손패 <span id="handCount"></span></strong><span id="hint"></span></div><div class="myHand" id="hand0"></div></section>
 <div id="message" class="message" aria-live="polite">게임 시작</div>
 <div id="callout" class="callout" aria-hidden="true"></div>
 <div id="overlay" class="overlay hide"><div class="dialog"><h2 id="dialogTitle">선택</h2><div id="dialogDetail"></div><div id="dialogBtns"></div></div></div>
 <div id="history" class="history hide"><b>최근 진행 기록</b><div id="historyBody"></div></div>
 </div><footer class="actions"><button id="playBtn">Enter 패 내기</button><button id="flipBtn">Enter 뒤집기</button><button id="bombBtn">B 폭탄</button><button id="shakeBtn">H 흔들기</button><button id="goBtn">G 고</button><button id="stopBtn">S 스톱</button><button id="nextBtn">R 새 판</button><button id="historyBtn">L 기록</button><span id="keyHelp">1~9 / 0 패 | ← → 이동 · Enter 확정 | Esc 설정</span></footer></main>
<script src="js/manifest.js"></script><script src="js/multi-engine.js"></script><script src="js/ui.js"></script></body></html>
